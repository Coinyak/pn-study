<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="영양불백 · 정맥영양(PN) 학습">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>영양불백 · PN 학습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --ink: #2a1520;
    --ink-soft: #5c3a48;
    --mist: #8a6572;
    --brand: #6b2440;
    --accent: #c45a7a;
    --foam: rgba(255, 248, 250, 0.82);
    --foam-strong: rgba(255, 255, 255, 0.94);
    --line: rgba(42, 21, 32, 0.1);
    --line-hot: rgba(196, 90, 122, 0.42);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100%;
    color: var(--ink);
    font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", sans-serif;
    background:
      radial-gradient(ellipse 900px 520px at 18% -10%, rgba(232, 160, 180, 0.28), transparent 58%),
      radial-gradient(ellipse 700px 480px at 92% 12%, rgba(244, 190, 200, 0.22), transparent 52%),
      radial-gradient(ellipse 600px 400px at 50% 110%, rgba(255, 220, 228, 0.45), transparent 55%),
      linear-gradient(168deg, #fff5f7 0%, #f8e4ea 46%, #f0d4de 100%);
    background-attachment: fixed;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, 0.22) 50%, transparent 60%);
    background-size: 220% 100%;
    animation: mist-sweep 14s ease-in-out infinite;
    opacity: 0.65;
  }

  .page {
    position: relative;
    z-index: 1;
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: clamp(2rem, 6vw, 4rem) 1.25rem clamp(1.5rem, 4vw, 2.5rem);
  }

  .hero {
    width: min(100%, 28rem);
    text-align: center;
  }

  .brand {
    margin: 0 0 0.85rem;
    font-family: "Noto Serif KR", "Apple SD Gothic Neo", serif;
    font-weight: 700;
    font-size: clamp(2.75rem, 9vw, 3.85rem);
    letter-spacing: -0.04em;
    line-height: 1.05;
    color: var(--brand);
    opacity: 0;
    transform: translateY(16px);
    animation: rise 0.85s var(--ease) 0.06s forwards;
  }

  .line {
    margin: 0 0 2rem;
    font-size: clamp(1.05rem, 2.8vw, 1.2rem);
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--ink-soft);
    opacity: 0;
    transform: translateY(14px);
    animation: rise 0.85s var(--ease) 0.18s forwards;
  }

  .ctas {
    display: grid;
    gap: 0.65rem;
    opacity: 0;
    transform: translateY(16px);
    animation: rise 0.9s var(--ease) 0.32s forwards;
  }

  .cta {
    display: block;
    padding: 1.05rem 1.2rem;
    text-align: left;
    text-decoration: none;
    color: inherit;
    background: var(--foam);
    border: 1px solid var(--line);
    border-radius: 14px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.55) inset;
    transition:
      border-color 0.28s var(--ease),
      background 0.28s var(--ease),
      transform 0.28s var(--ease),
      box-shadow 0.28s var(--ease);
  }

  .cta:hover,
  .cta:focus-visible {
    background: var(--foam-strong);
    border-color: var(--line-hot);
    transform: translateY(-3px);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.7) inset,
      0 14px 32px rgba(42, 21, 32, 0.1);
    outline: none;
  }

  .cta:focus-visible {
    box-shadow:
      0 0 0 3px rgba(196, 90, 122, 0.25),
      0 14px 32px rgba(42, 21, 32, 0.1);
  }

  .cta strong {
    display: block;
    font-size: 1.08rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--brand);
  }

  .cta span {
    display: block;
    margin-top: 0.18rem;
    font-size: 0.9rem;
    color: var(--mist);
  }

  .cta-primary {
    border-color: rgba(196, 90, 122, 0.32);
  }

  .cta-primary strong::after {
    content: "";
    display: inline-block;
    width: 0.45rem;
    height: 0.45rem;
    margin-left: 0.45rem;
    border-radius: 50%;
    background: var(--accent);
    vertical-align: 0.12em;
    animation: pulse 2.4s ease-in-out infinite;
  }

  /* Companion art — always opaque; no wash/mask/blend/pseudo chip */
  .companions {
    position: relative;
    margin: 1.85rem auto 0;
    width: min(100%, 17.5rem);
    pointer-events: none;
    opacity: 1;
    background: transparent;
    border-radius: 0;
    overflow: visible;
    box-shadow: none;
    filter: none;
    mix-blend-mode: normal;
    -webkit-mask-image: none;
    mask-image: none;
    transform: translateY(12px);
    animation: rise-y 1s var(--ease) 0.48s forwards;
  }

  .companions::before,
  .companions::after {
    content: none !important;
    display: none !important;
  }

  .companions picture {
    display: block;
    position: relative;
    z-index: 1;
    width: 100%;
    opacity: 1;
    filter: none;
    mix-blend-mode: normal;
    animation: float-soft 7.2s ease-in-out 1.5s infinite;
  }

  .companions img {
    display: block;
    width: 100%;
    height: auto;
    opacity: 1;
    filter: none;
    mix-blend-mode: normal;
    -webkit-mask-image: none;
    mask-image: none;
    border-radius: 0;
    box-shadow: none;
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes rise-y {
    to { transform: translateY(0); }
  }

  @keyframes mist-sweep {
    0%, 100% { background-position: 100% 0; }
    50% { background-position: 0% 0; }
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.55; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.15); }
  }

  @keyframes float-soft {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  @media (max-width: 420px) {
    .companions {
      width: min(100%, 13.5rem);
      margin-top: 1.4rem;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    body::before { animation: none; }
    .brand, .line, .ctas, .companions {
      opacity: 1;
      transform: none;
      animation: none;
    }
    .cta-primary strong::after { animation: none; }
    .cta:hover, .cta:focus-visible { transform: none; }
  }
</style>
</head>
<body>
  <!-- deploy-stamp: 2026-11-13-solid-white-bodies -->
  <div class="page">
    <main class="hero">
      <p class="brand">영양불백</p>
      <p class="line">정맥영양 핵심을 시험 흐름에 맞춰 이어 봅니다</p>
      <nav class="ctas" aria-label="학습 진입">
        <a class="cta cta-primary" href="PN_study_split.html">
          <strong>핵심 + 문제</strong>
          <span>정리와 연계 퀴즈를 나란히</span>
        </a>
        <a class="cta" href="PN_core_A4_print.html">
          <strong>핵심본 (A4)</strong>
          <span>인쇄·PDF용 · 문제 없음</span>
        </a>
      </nav>
      <div class="companions" aria-hidden="true">
        <picture>
          <source srcset="assets/chiikawa.webp" type="image/webp">
          <img src="assets/chiikawa.png" alt="" width="802" height="358" decoding="async">
        </picture>
      </div>
    </main>
  </div>
</body>
</html>
