<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>영양불백 · PN 학습</title>
<style>
  :root { color-scheme: light; --navy:#1e3a5f; --text:#1a2332; --muted:#5b6575; --bg:#f0f3f7; --panel:#fff; --line:#b8c0cc; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }
  main { max-width: 42rem; margin: 0 auto; padding: 2.5rem 1.25rem 3rem; }
  h1 { font-size: 1.55rem; color: var(--navy); margin: 0 0 .35rem; }
  p.lead { color: var(--muted); margin: 0 0 1.5rem; }
  .links { display: grid; gap: .85rem; }
  a.card { display:block; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:1rem 1.1rem; text-decoration:none; color:inherit; }
  a.card:hover { border-color: var(--navy); }
  a.card strong { display:block; color:var(--navy); font-size:1.05rem; margin-bottom:.2rem; }
  a.card span { color:var(--muted); font-size:.92rem; }
</style>
</head>
<body>
<main>
  <h1>영양불백 · PN 학습</h1>
  <p class="lead">정맥영양 핵심표 · 문제 연계 학습 페이지</p>
  <div class="links">
    <a class="card" href="PN_study_split.html">
      <strong>핵심 + 문제</strong>
      <span>좌측 짜그리 핵심표 · 우측 연계 퀴즈 (대화형)</span>
    </a>
    <a class="card" href="PN_core_A4_print.html">
      <strong>핵심만 (A4 인쇄)</strong>
      <span>인쇄·PDF용 핵심본 · 문제 패널 없음</span>
    </a>
  </div>
</main>
</body>
</html>
