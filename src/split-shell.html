<style>

*{box-sizing:border-box}

.main{ --split-core:1fr; --split-quiz:1fr; --split-w:10px; display:grid; grid-template-columns:72px minmax(0,var(--split-core)) var(--split-w) minmax(0,var(--split-quiz)); min-height:0;overflow:hidden;
}
.nav{background:var(--label2);border-right:1px solid var(--line);overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
.nav-item{border:0;border-bottom:1px solid #c5d0bc;background:transparent;padding:8px 3px;font-size:11px;font-weight:700;line-height:1.3;color:var(--text);cursor:pointer;text-align:center;min-height:40px}

}
.splitter::before{ content:"";position:absolute;inset:0 4px;background:var(--line);border-radius:1px;
}

.nowrap{white-space:nowrap}

table.jg.nest.dense.conc col.c-el{width:12%}

.bl{margin:.15em 0 0;padding-left:1.15em;list-style:disc}

.l1,.th{background:var(--zebra);font-weight:700}

.th{background:#eef2f6;font-size:12.5px}
.x{color:var(--danger);font-weight:700}

button.fn{ border:0;background:transparent;color:var(--fn);cursor:pointer; font:inherit;font-size:.68em;font-weight:600;line-height:1; padding:0 .12em;margin:0 0 0 .06em; vertical-align:baseline;position:relative;top:-.42em; opacity:.78;letter-spacing:-.02em;
}

button.fn:focus-visible{box-shadow:0 0 0 2px rgba(26,95,180,.25);border-radius:2px}

button.fn.active{color:var(--fn-hover);opacity:1;outline:2px solid var(--chip-on);outline-offset:1px;border-radius:2px}

.quiz-sticky{flex-shrink:0;background:var(--quiz);border-bottom:1px solid var(--line);z-index:3}

.quiz-head-title{min-width:0;flex:0 1 auto}

.quiz-scope button:hover{border-color:var(--chip-on);color:var(--chip-on)}
.quiz-scope button[aria-pressed="true"]{background:#e7f0fb;border-color:var(--chip-on);color:var(--chip-on);box-shadow:inset 0 -2px 0 var(--chip-on)}
.quiz-scope button[data-filter="o"][aria-pressed="true"]{background:#ecfdf3;border-color:#16a34a;color:#16a34a;box-shadow:inset 0 -2px 0 #16a34a}
.quiz-scope button[data-filter="x"][aria-pressed="true"]{background:#fef2f2;border-color:#dc2626;color:#dc2626;box-shadow:inset 0 -2px 0 #dc2626}

.quiz-scope button:focus-visible{outline:2px solid var(--chip-on);outline-offset:1px}
@media (max-width:899px){.quiz-scope button{min-height:32px}}
.cite-box{display:none;padding:0 12px 10px}
.cite-box.show{display:block}
.cite-box .cite-inner{background:#fff;border:1px solid #d0d7e2;padding:12px 14px;font-size:13.5px;line-height:1.55}
.cite-box .cite-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.cite-box .cite-raw{font-size:15px;font-weight:700;color:var(--navy);word-break:break-word;line-height:1.4}
.cite-box .cite-meta{margin-top:6px;font-size:12.5px;color:var(--muted);line-height:1.45}
.cite-box .cite-close{border:0;background:#eef2f6;color:var(--muted);width:32px;height:32px;border-radius:4px;cursor:pointer;font-size:18px;line-height:1;flex-shrink:0}
.qcard{background:#fff;border:1px solid #d8dee8;margin:8px 10px;padding:12px 14px}

.qcard .stem{font-size:15px;line-height:1.65;margin-bottom:10px}
.qcard ol{margin:0;padding-left:1.35em;font-size:14px;line-height:1.6}
.qcard ol li{margin:.35em 0}
.qcard details{margin-top:12px;font-size:13.5px;line-height:1.55}
.qcard summary{cursor:pointer;color:var(--chip-on);font-weight:600;min-height:40px;display:flex;align-items:center}
.empty{padding:20px 14px;color:var(--muted);font-size:14px;line-height:1.55}
.callout{margin:0;padding:9px 12px;border-bottom:1px solid #e2e8f0;font-size:13.5px;line-height:1.6}
.callout.gap{background:#fff8e1;border-left:4px solid #f0a500;color:#5a4300}

} .qcard{cursor:pointer}

tr.core-hl > td, td.core-hl, .cell.core-hl, li.core-hl{ background:transparent !important;
}
tr.core-hl > td:first-child, li.core-hl{ box-shadow:inset 3px 0 0 #ef6c00;
}
mark.core-hl-exact, span.core-hl-exact, .core-hl-exact{ color: inherit !important; text-decoration: underline !important; text-decoration-color: #ef6c00 !important; text-decoration-thickness: 2px !important; text-underline-offset: 2px !important; box-shadow: none !important; border: none !important; border-radius: 0; background: transparent !important; -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
/* plain wrap: keyword underline only — no wash / no full-row edges */
span.core-hl-wrap.core-hl-exact{ background: transparent !important; color: inherit !important; padding: 0;
}
/* exam fluorescents keep fill; orange underline still marks the hit phrase */
mark.hl-pink.core-hl-exact{ background: linear-gradient(transparent 8%, #f8bbd0 8%, #f8bbd0 92%, transparent 92%) !important; color: inherit !important;
}
mark.hl-yellow.core-hl-exact{ background: linear-gradient(transparent 8%, #fff59d 8%, #fff59d 92%, transparent 92%) !important; color: inherit !important;
}
mark.hl-both.core-hl-exact{ background: linear-gradient(#f8bbd0,#f8bbd0) top / 100% 46% no-repeat, linear-gradient(#fff59d,#fff59d) bottom / 100% 46% no-repeat !important; color: inherit !important; box-shadow: none !important;
} /* Exam-origin fluorescent marks on 핵심본 */
mark.hl-pink, .hl-pink{ background: linear-gradient(transparent 8%, #f8bbd0 8%, #f8bbd0 92%, transparent 92%); color: inherit; padding: 0 .05em; box-decoration-break: clone; -webkit-box-decoration-break: clone;
}

}

}

<script>
const QUESTION_BANK = /*@@QUESTION_BANK@@*/[];

function normTxt(s){
  let t = String(s||"")
    .replace(/[₀₁₂₃₄₅₆₇₈₉]/g, m => "0123456789"["₀₁₂₃₄₅₆₇₈₉".indexOf(m)])
    .replace(/[·•∙⋅]/g, " ")
    .replace(/[–—−]/g, "-")
    .replace(/~/g, "-")
    .replace(/[²]/g, "2")
    .replace(/[μµ]/g, "u")
    .replace(/\s+/g, " ")
    .trim()
    .toLowerCase();
  // Korean ↔ core aliases so quiz stems match HTML marks
  const aliases = [
    [/크론병?/g, "crohn"],
    [/불내성/g, "실패"],
    [/경장영양/g, "en"],
    [/정맥영양/g, "pn"],
    [/티아민|vitamin b1|vit\.?\s*b1/g, "thiamine"],
    [/시스테인/g, "cysteine"],
    [/구리/g, "cu"],
    [/망간/g, "mn"],
    [/셀레늄/g, "se"],
    [/아연/g, "zn"],
  ];
  aliases.forEach(([re, rep])=>{ t = t.replace(re, rep); });
  return t;
}
function needlesFromQuestion(q){
  const out = [];
  const push = (t, w)=>{
    const s = String(t||"").trim();
    if(s.length < 2) return;
    out.push({t:s, n:normTxt(s), w});
  };
  // CORE_HINTS beat generic q.needle (avoids GIR/1.2/고혈당 landing on wrong row)
  const hints = CORE_HINTS[q.id] || [];
  hints.forEach(t=>push(t, 240));
  if(q.needle) push(q.needle, hints.length ? 100 : 200);
  const ans = (q.choices && q.choices[q.answer] != null) ? String(q.choices[q.answer]) : "";
  if(ans){
    push(ans, 120);
    const skipFrag = /^(kg|day|d|h|hr|g|mg|ml|l|um|μm|kcal|min|및|와|and|the|of)$/i;
    ans.split(/[·,\/]| 와 | 및 | and |·/).forEach(p=>{
      const t = p.trim();
      if(t.length < 3 || skipFrag.test(t)) return;
      push(t, 80);
    });
  }
  const stem = String(q.stem||"");
  const stemRules = [
    [/간접열량|IC\b|흡기|호기/i, ["흡기 O₂","호기 CO₂","간접열량"]],
    [/GIR|포도당 주입|mg\/kg\/min/i, ["GIR","mg/kg/min","5~7","≤4"]],
    [/140\s*[–\-~]\s*180|혈당 조절|혈당 목표/i, ["140~180","140–180"]],
    [/간담도|담즙|trace|미량원소.*줄/i, ["Cu·Mn","담즙울체","간담도"]],
    [/파킨슨/i, ["파킨슨","Mn"]],
    [/재급식|refeeding/i, ["재급식","thiamine","P·K·Mg"]],
    [/EFAD|필수지방/i, ["EFAD","리놀레"]],
    [/필터|0\.22|1\.2\s*μm/i, ["필터","단일 1.2","0.22"]],
    [/hang time|12\s*시간|24\s*시간.*지질|지질.*24/i, ["Hang — TNA","Hang — ILE","12시간","24"]],
    [/PICC|말초삽입 중심/i, ["PICC tip SVC","PICC"]],
    [/900|말초정맥영양|PPN/i, ["900","말초"]],
    [/IBW|표준체중|이상체중/i, ["키(m)² × 22","IBW"]],
    [/Ca.?P|침전|gluconate/i, ["Ca–P","침전","gluconate"]],
    [/\bTG\b|중성지방|≥\s*400|>\s*400|\b400\s*mg/i, ["TG ≥400","400","TG"]],
    [/크론|Crohn/i, ["Crohn","EN 실패/불가","장휴식"]],
    [/고혈당/i, ["고혈당"]],
    [/저혈당/i, ["저혈당"]],
    [/BCAA|분지쇄/i, ["BCAA"]],
    [/Wernicke|티아민|thiamine|Vitamin B1/i, ["thiamine","티아민"]],
    [/시스테인|cysteine/i, ["cysteine","시스테인"]],
  ];
  stemRules.forEach(([re, keys])=>{ if(re.test(stem)) keys.forEach(k=>push(k, 90)); });
  const map = new Map();
  out.forEach(o=>{
    const prev = map.get(o.n);
    if(!prev || o.w > prev.w) map.set(o.n, o);
  });
  return [...map.values()];
}
function needleHit(hay, needle){
  if(!needle) return false;
  // Short Latin tokens (ic, n, …) must be whole words — else "ic" hits NICU/PICU
  if(needle.length <= 3 && /^[a-z0-9]+$/i.test(needle)){
    const re = new RegExp('(?:^|[^a-z0-9])'+needle.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?:[^a-z0-9]|$)');
    return re.test(hay);
  }
  return hay.includes(needle);
}
function scoreNode(node, needles, ansN){
  const raw = (node.textContent||"").replace(/\s+/g," ").trim();
  if(raw.length < 4) return null;
  const t = normTxt(raw);
  let score = 0;
  needles.forEach(n=>{
    if(!n.n) return;
    if(needleHit(t, n.n)) score += n.w;
  });
  if(ansN && ansN.length >= 4 && needleHit(t, ansN)) score += 150;
  // structural bonus only when content actually matched
  if(score <= 0) return null;
  if(node.tagName === "LI") score += 25;
  else if(node.tagName === "TR") score += 15;
  else if(node.tagName === "TD") score += 8;
  if(node.classList && node.classList.contains("hub")) score -= 80;
  if(raw.length > 500) score -= Math.min(60, Math.floor(raw.length/80));
  return {node, score, raw};
}
function visibleCoreSections(q){
  return (q.coreSectionIds || []).map(id=>document.getElementById(id))
    .filter(sec=>sec && !sec.hidden && sec.matches("#core .sec"));
}
function highlightFromQuestion(q){
  clearCoreHl();
  if(!q) return null;
  const mapped = visibleCoreSections(q);
  if(!mapped.length && CORE_SKIP.has(q.id)) return null;
  // Preserve the active quiz scope while moving the core pane.
  const allSecs = [...document.querySelectorAll("#core .sec:not([hidden])")];
  const topicSecs = allSecs.filter(sec=>sec.dataset.topic === q.topic);
  const needles = needlesFromQuestion(q);
  const ansN = (q.choices && q.choices[q.answer] != null) ? normTxt(q.choices[q.answer]) : "";
  const minScore = 80;
  const collect = (secs)=>{
    const out=[];
    secs.forEach(sec=>{
      sec.querySelectorAll("li, tr, .cell, .sec-h").forEach(node=>{
        const hit = scoreNode(node, needles, ansN);
        if(hit) out.push({...hit, sec});
      });
    });
    out.sort((a,b)=>b.score-a.score || a.raw.length-b.raw.length);
    return out;
  };
  // Prefer current 단원; if CORE_HINTS exist, prefer a row that actually contains a hint (may widen).
  const hints = CORE_HINTS[q.id] || [];
  const hintNs = hints.map(h=>normTxt(h)).filter(h=>h.length>=2);
  const hasHint = (c)=> hintNs.some(h=>normTxt(c.raw).includes(h));
  const topHint = hintNs[0] || "";
  const hasTop = (c)=> !!topHint && normTxt(c.raw).includes(topHint);
  // Prefer leaf li/tr over parent .cell that aggregates children (pn-024 CDC vs catheter types).
  const preferLeafHint = (list, pred)=>{
    const hits = list.filter(pred);
    if(!hits.length) return null;
    hits.sort((a,b)=>{
      const leaf = (c)=>{
        const t = c.node && c.node.tagName;
        if(t==="LI" || t==="TR") return 0;
        if(t==="TD") return 1;
        return 2;
      };
      return leaf(a)-leaf(b) || a.raw.length-b.raw.length || b.score-a.score;
    });
    return hits[0];
  };
  let candidates = collect(mapped.length ? mapped : topicSecs.length ? topicSecs : allSecs);
  let usedWider = false;
  if(mapped.length){
    const mappedHint = preferLeafHint(candidates, hasTop) || preferLeafHint(candidates, hasHint);
    if(mappedHint) candidates = [mappedHint, ...candidates.filter(c=>c !== mappedHint)];
  } else if(hintNs.length){
    const wider = collect(allSecs);
    const localTop = preferLeafHint(candidates, hasTop);
    const wideTop = preferLeafHint(wider, hasTop);
    const localHint = preferLeafHint(candidates, hasHint);
    const wideHint = preferLeafHint(wider, hasHint);
    // Top/specific hint outside topic beats in-topic generic needle hits (oe-filter, pn-003).
    if(localTop){
      candidates = [localTop, ...candidates.filter(c=>c!==localTop)];
    } else if(wideTop){
      candidates = [wideTop, ...wider.filter(c=>c!==wideTop)];
      usedWider = true;
    } else if(localHint){
      candidates = [localHint, ...candidates.filter(c=>c!==localHint)];
    } else if(wideHint){
      candidates = [wideHint, ...wider.filter(c=>c!==wideHint)];
      usedWider = true;
    } else if((!candidates.length || candidates[0].score < minScore) && wider.length && wider[0].score >= minScore){
      candidates = wider;
      usedWider = true;
    }
  } else if((!candidates.length || candidates[0].score < minScore) && topicSecs.length){
    const wider = collect(allSecs);
    if(wider.length && wider[0].score >= minScore){
      candidates = wider;
      usedWider = true;
    }
  }
  const best = candidates[0];
  if(!best || best.score < minScore){
    if(!mapped.length) return null;
    const heading = mapped[0].querySelector(".sec-h") || mapped[0];
    heading.classList.add("core-hl");
    return landCore(heading, false);
  }
  let target = best.node;
  if(target.tagName === "TD") target = target.closest("tr") || target;

  // Phrase-only highlight — prefer CORE_HINTS / answer mark·wrap before generic needle marks
  let exact = null;
  const marks = [...target.querySelectorAll("mark")];
  for(const mk of marks){
    const mn = normTxt(mk.textContent);
    // Avoid short marks (e.g. PICC) stealing compound hints like "PICC tip SVC".
    if(hintNs.some(h=>mn.includes(h)||(mn.length>=4 && h.includes(mn) && mn.length>=h.length*0.5))){ exact = mk; break; }
  }
  if(!exact && ansN && ansN.length>=3){
    for(const mk of marks){
      const mn = normTxt(mk.textContent);
      if(mn.includes(ansN) || ansN.includes(mn)){ exact = mk; break; }
    }
  }
  const phrasePrefer = [
    ...hints,
    (q.choices && q.choices[q.answer]) || ""
  ].filter(Boolean);
  if(!exact){
    for(const ph of phrasePrefer){
      exact = wrapPhraseInNode(target, ph);
      if(exact) break;
    }
  }
  if(!exact){
    for(const mk of marks){
      const mn = normTxt(mk.textContent);
      if(needles.some(n=>n.w>=80 && n.n.length>=2 && (mn.includes(n.n)||(mn.length>=4 && n.n.includes(mn) && mn.length>=n.n.length*0.5)))){ exact = mk; break; }
    }
  }
  if(!exact){
    for(const ph of needles.filter(n=>n.w>=80).map(n=>n.t)){
      exact = wrapPhraseInNode(target, ph);
      if(exact) break;
    }
  }
  if(exact){
    exact.classList.add("core-hl-exact");
  }
  (exact?.closest("tr, li") || target).classList.add("core-hl");
  return landCore(exact || target, usedWider);
}
function landCore(aim, usedWider){
  const landedSec = aim.closest(".sec");
  if(landedSec){
    activeSecId = landedSec.id;
    syncNavHighlight(landedSec.id);
  }
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const behavior = (usedWider && !reduceMotion) ? "smooth" : "auto";
  // Show core pane first on mobile so scroll metrics are measured on the visible pane
  if(window.matchMedia("(max-width:899px)").matches) setPane("core");
  clearTimeout(spyTimer);
  spyLock = behavior === "smooth";
  if(spyLock) spyTimer = setTimeout(()=>{ spyLock = false; }, 2000);
  scrollCoreTo(aim, {center:true, behavior});
  return landedSec;
}
function isKoreanStem(stem){
  const letters=String(stem||"").match(/[A-Za-z가-힣]/g)||[];
  if(!letters.length) return true;
  const latin=letters.filter(c=>c.charCodeAt(0)<128).length;
  return latin/letters.length <= 0.9;
}

    const ans=q.choices[q.answer]||"";
    const linked = !CORE_SKIP.has(q.id);
    const cardHint = linked ? ' title="줄기 클릭 시 왼쪽 핵심본을 형광 표시"' : '';
    const stemControl = linked ? ' role="button" tabindex="0" title="핵심본에서 위치 표시"' : '';
    const linkNote = linked ? '' : ' · 핵심 연결 없음';
    const choices=q.choices.map(c=>`<li>${escapeHtml(c)}</li>`).join("");
    return `<article class="qcard${linked ? '' : ' no-core'}" data-qid="${escapeHtml(q.id)}"${cardHint}>
      <div class="src">${escapeHtml(q.source)} · ${escapeHtml(q.id)}${linkNote}</div>
      <div class="stem"${stemControl}>${escapeHtml(q.stem)}</div>
      <ol>${choices}</ol>
      <details><summary>정답·해설 보기</summary>
      <p><b>정답:</b> ${q.answer+1}. ${escapeHtml(ans)}</p>
      <p>${escapeHtml(q.explain||"")}</p></details></article>`;
  }).join("");
}

function syncNavHighlight(secId){
  document.querySelectorAll(".nav-item").forEach(b=>{
    const active = b.dataset.target === secId;
    b.classList.toggle("active", active);
    if(active) b.setAttribute("aria-current", "location");
    else b.removeAttribute("aria-current");
  });
  document.querySelectorAll(".sec").forEach(s=>{
    s.classList.toggle("active-sec", s.id === secId);
  });
  const activeBtn = document.querySelector(".nav-item.active");
  if(activeBtn){
    const nav = navEl();
    const nb = activeBtn.getBoundingClientRect();
    const nr = nav.getBoundingClientRect();
    if(nb.top < nr.top || nb.bottom > nr.bottom){
      activeBtn.scrollIntoView({block:"nearest", inline:"nearest"});
    }
  }
}
function scrollCoreTo(el, {center=false, behavior="auto"}={}){
  const core = coreEl();
  if(!core || !el) return;
  const cRect = core.getBoundingClientRect();
  const eRect = el.getBoundingClientRect();
  const offset = center ? (core.clientHeight - eRect.height) / 2 : 0;
  const next = core.scrollTop + (eRect.top - cRect.top) - offset;
  core.scrollTo({top: Math.max(0, next), behavior});
  // Preserve explicit selections until the reader scrolls away from the jump.
  if(behavior === "auto") spyScrollTop = core.scrollTop;
}
function showCite(cid, topicFromBtn, secIdFromBtn){
  const c = CITE_BY_ID[String(cid)];
  const box = document.getElementById("citeBox");
  document.querySelectorAll("button.fn").forEach(b=>b.classList.toggle("active", b.dataset.cite===String(cid)));
  if(!c){ hideCite(); return; }
  if(topicFromBtn) activeTopic = topicFromBtn;
  if(secIdFromBtn) activeSecId = secIdFromBtn;
  const kind = KIND_KO[c.kind] || c.kind;
  const pages = (c.pages||[]).length ? " · "+c.pages.join(", ") : "";
  const related = QUESTIONS.filter(q=>q.topic===activeTopic);
  box.innerHTML = `<div class="cite-inner"><div class="cite-top"><div>
      <div class="muted">색인 ${c.id} · ${escapeHtml(kind)}${escapeHtml(pages)}</div>
      <div class="cite-raw">${escapeHtml(c.raw)}</div>
      <div class="cite-meta">오른쪽 문제는 소단원「${escapeHtml(TOPIC_LABEL[activeTopic]||activeTopic)}」기준 · ${related.length}문항</div>
    </div>
    <button type="button" class="cite-close" aria-label="닫기" title="닫기">×</button>
  </div></div>`;
  box.classList.add("show");
  syncNavHighlight(activeSecId);
  renderQuiz();
  if(window.matchMedia("(max-width:899px)").matches) setPane("quiz");
}
function setTopic(tid, {scroll=true, target=null}={}){
  activeTopic = tid;
  if(target) activeSecId = target;
  clearTimeout(spyTimer);
  spyLock = false;
  hideCite();
  clearCoreHl();
  document.querySelectorAll(".qcard.hl").forEach(card=>card.classList.remove("hl"));
  if(scroll){
    let el = target ? document.getElementById(target) : null;
    if(!el || el.hidden || el.hasAttribute("data-hub")){
      el = document.querySelector('.sec[data-topic="'+tid+'"]:not([hidden]):not([data-hub])');
    }
    if(el){
      activeSecId = el.id;
      scrollCoreTo(el);
    }
  }
  syncNavHighlight(activeSecId);
  renderQuiz();
}
function setupScrollSpy(){
  const core = coreEl();
  if(!core) return;
  const secs = [...core.querySelectorAll(".sec:not([hidden]):not([data-hub])")];
  if(!secs.length) return;
  let ticking = false;

  function pickActive(){
    if(spyLock || !core.clientHeight || core.scrollTop === spyScrollTop) return;
    spyScrollTop = core.scrollTop;
    // Track the visible heading, allowing for fractional pixels at the pane edge.
    const marker = core.getBoundingClientRect().top + 1;
    let current = secs[0];
    for(const sec of secs){
      if(sec.getBoundingClientRect().top > marker) break;
      current = sec;
    }
    const maxScroll = core.scrollHeight - core.clientHeight;
    if(maxScroll > 0 && core.scrollTop >= maxScroll - 1) current = secs[secs.length - 1];
    if(current.id === activeSecId) return;
    activeSecId = current.id;
    syncNavHighlight(current.id);
    if(current.dataset.topic === activeTopic) return;
    // 문제 클릭의 프로그램 스크롤은 위의 spyLock에서 이미 빠진다.
    // 단원이 바뀌면 이전 핵심 표시를 지워 목록이 옛 .core-hl에 고정되지 않게 한다.
    // 단원별만 오른쪽 목록을 그 단원으로 갱신하고, 전체는 한 단원으로 줄이지 않는다.
    activeTopic = current.dataset.topic;
    clearCoreHl();
    if(window.quizListScope !== "all"){
      renderQuiz();
      hideCite();
    }
  }

  core.addEventListener("scroll", ()=>{
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(()=>{ ticking = false; pickActive(); });
  }, {passive:true});
  pickActive();
}
document.getElementById("nav").addEventListener("click", e=>{
  const b=e.target.closest(".nav-item"); if(!b) return;
  if(window.matchMedia("(max-width:899px)").matches) setPane("core");
  setTopic(b.dataset.topic, {scroll:true, target:b.dataset.target});
});
document.getElementById("tabs").addEventListener("click", e=>{
  const b=e.target.closest("button[data-pane]"); if(!b) return; setPane(b.dataset.pane);
});
document.getElementById("core").addEventListener("click", e=>{
  const fn=e.target.closest("button.fn");
  if(fn){
    e.preventDefault();
    const sec = fn.closest(".sec");
    showCite(fn.dataset.cite, fn.dataset.topic, sec && sec.id);
    return;
  }
  const sec=e.target.closest(".sec"); if(!sec) return;
  setTopic(sec.dataset.topic, {scroll:false, target:sec.id});
});
document.getElementById("citeBox").addEventListener("click", e=>{
  if(e.target.closest(".cite-close")) hideCite();
});
const hashSec=(()=>{
  try{ const el=document.getElementById(decodeURIComponent(location.hash.slice(1))); return el && el.classList.contains("sec") ? el : null; }
  catch(e){ return null; }
})();
const firstNav=document.querySelector(".nav-item");
if(hashSec) setTopic(hashSec.dataset.topic, {scroll:true, target:hashSec.id});
else if(firstNav) setTopic(firstNav.dataset.topic, {scroll:false, target:firstNav.dataset.target});
else renderQuiz();

function activateQcard(card){
  if(!card) return;
  const q = QUESTIONS.find(x=>x.id===card.dataset.qid);
  if(!q || CORE_SKIP.has(q.id)) return;
  document.querySelectorAll(".qcard").forEach(c=>c.classList.toggle("hl", c===card));
  highlightFromQuestion(q);
}
document.getElementById("quizList").addEventListener("click", e=>{
  // Answering (radio/label/buttons in study-ui cards) must never jump the core pane.
  const stem = e.target.closest('.stem[role="button"]'); if(!stem || stem.closest(".sq")) return;
  activateQcard(stem.closest(".qcard"));
});
document.getElementById("quizList").addEventListener("keydown", e=>{
  if(!e.target.matches('.qcard:not(.sq) .stem[role="button"]') || (e.key !== "Enter" && e.key !== " ")) return;
  e.preventDefault();
  activateQcard(e.target.closest(".qcard"));
});

setupScrollSpy();

/* Desktop core↔quiz splitter: default 50/50 of space after left nav; drag + localStorage */
(function setupSplitResize(){
  const main = document.querySelector(".main");
  const splitter = document.getElementById("splitter");
  if(!main || !splitter) return;

  const LS_KEY = "pn-study-split-core-pct";
  const MIN_PCT = 22;
  const MAX_PCT = 78;
  const desktopMq = window.matchMedia("(min-width:900px)");
  let corePct = 50;

  function clampPct(n){
    n = Number(n);
    if(!Number.isFinite(n)) n = 50;
    const {usable} = contentBounds();
    // At the desktop breakpoint, both panes still need enough room to read.
    const min = desktopMq.matches ? Math.max(MIN_PCT, Math.min(50, Math.ceil(100 * 280 / usable))) : MIN_PCT;
    const max = Math.min(MAX_PCT, 100 - min);
    return Math.min(max, Math.max(min, n));
  }
  function applySplit(pct){
    corePct = clampPct(pct);
    main.style.setProperty("--split-core", corePct + "fr");
    main.style.setProperty("--split-quiz", (100 - corePct) + "fr");
    splitter.setAttribute("aria-valuenow", String(Math.round(corePct)));
    splitter.setAttribute("aria-valuemin", String(clampPct(MIN_PCT)));
    splitter.setAttribute("aria-valuemax", String(clampPct(MAX_PCT)));
  }
  function loadStored(){
    try{
      const raw = localStorage.getItem(LS_KEY);
      if(raw == null) return 50;
      return clampPct(parseFloat(raw));
    }catch(_){ return 50; }
  }
  function persist(){
    try{ localStorage.setItem(LS_KEY, String(Math.round(corePct * 10) / 10)); }catch(_){}
  }

  splitter.setAttribute("role", "separator");
  let dragging = false;
  function contentBounds(){
    const rect = main.getBoundingClientRect();
    const nav = document.getElementById("nav");
    const navW = nav && desktopMq.matches ? nav.getBoundingClientRect().width : 0;
    const splitW = splitter.getBoundingClientRect().width || 10;
    const left = rect.left + navW;
    const usable = Math.max(1, rect.width - navW - splitW);
    return {left, usable};
  }
  applySplit(loadStored());
  window.addEventListener("resize", () => applySplit(corePct));
  function pctFromClientX(clientX){
    const {left, usable} = contentBounds();
    return clampPct(((clientX - left) / usable) * 100);
  }
  function onPointerMove(e){
    if(!dragging) return;
    applySplit(pctFromClientX(e.clientX));
  }
  function endDrag(e){
    if(!dragging) return;
    dragging = false;
    document.body.classList.remove("is-resizing");
    try{ splitter.releasePointerCapture(e.pointerId); }catch(_){}
    window.removeEventListener("pointermove", onPointerMove);
    window.removeEventListener("pointerup", endDrag);
    window.removeEventListener("pointercancel", endDrag);
    persist();
  }
  splitter.addEventListener("pointerdown", e=>{
    if(!desktopMq.matches) return;
    if(e.button != null && e.button !== 0) return;
    e.preventDefault();
    dragging = true;
    document.body.classList.add("is-resizing");
    try{ splitter.setPointerCapture(e.pointerId); }catch(_){}
    applySplit(pctFromClientX(e.clientX));
    window.addEventListener("pointermove", onPointerMove);
    window.addEventListener("pointerup", endDrag);
    window.addEventListener("pointercancel", endDrag);
  });

  // Keyboard nudge (desktop only)
  splitter.addEventListener("keydown", e=>{
    if(!desktopMq.matches) return;
    let next = null;
    if(e.key === "ArrowLeft") next = corePct - 2;
    else if(e.key === "ArrowRight") next = corePct + 2;
    else if(e.key === "Home") next = MIN_PCT;
    else if(e.key === "End") next = MAX_PCT;
    if(next == null) return;
    e.preventDefault();
    applySplit(next);
    persist();
  });
})();
