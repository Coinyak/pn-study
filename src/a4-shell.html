<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>영양불백 · PN 핵심 (A4)</title>
<style>
:root{ color-scheme:light; --navy:#1e3a5f; --label:#dce8d4; --label2:#e8f0e4; --zebra:#f7f9fc; --line:#b8c0cc; --text:#1a2332; --muted:#5b6575; --danger:#c62828;
}
*{box-sizing:border-box}
html,body{overflow:visible!important}
body{ margin:0 auto; max-width:210mm; padding:6mm 6mm; font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif; font-size:8.5pt; line-height:1.28; color:var(--text); background:#fff; overflow-wrap:anywhere; word-break:keep-all;
}
.toolbar{ position:sticky; top:0; z-index:5; background:#f4f6f8; border:1px solid var(--line); padding:6px 10px; margin:-4mm -3mm 5mm; display:flex; gap:8px; align-items:center; font-size:11px; flex-wrap:nowrap;
}
.toolbar button{ border:1px solid var(--navy); background:var(--navy); color:#fff; padding:6px 10px; font-size:12px; cursor:pointer; border-radius:3px; flex:0 0 auto;
}
.toolbar a{color:#1a5fb4; flex:0 0 auto}
.note{color:var(--muted); font-size:8pt; font-weight:500}
#corePrint{outline:none; overflow:visible!important; max-width:100%}
#corePrint:focus{outline:none}
h1{ font-size:13pt; margin:0 0 3mm; color:var(--navy); border-bottom:2.5px solid var(--navy); padding:0 0 1.5mm; letter-spacing:-.02em; font-weight:800;
}
h2{ font-size:9.5pt; margin:1.8mm 0 0.6mm; padding:1.2mm 2mm; background:var(--label); color:var(--navy); font-weight:800; border-left:3px solid var(--navy); letter-spacing:-.02em; break-after:avoid; page-break-after:avoid; break-inside:avoid; -webkit-print-color-adjust:exact; print-color-adjust:exact;
}
h3{ font-size:8.5pt; margin:1.3mm 0 0.5mm; padding:1mm 1.8mm; background:#eef2f6; color:var(--navy); font-weight:700; border-left:2.5px solid #7a9ab8; break-after:avoid; page-break-after:avoid; break-inside:avoid; -webkit-print-color-adjust:exact; print-color-adjust:exact;
}
/* Tables — readable padding; keep whole table on one page when it fits */
table{ width:100%!important; max-width:100%!important; border-collapse:collapse; table-layout:auto; margin:0 0 1.2mm; font-size:7.8pt; line-height:1.28;
  break-inside:avoid; page-break-inside:avoid;
}
th, td{ border:1px solid var(--line); padding:0.55mm 0.85mm; vertical-align:top; overflow-wrap:break-word; word-break:keep-all; white-space:normal;
}
th, .th{ background:#eef2f6; font-weight:700; font-size:7.5pt; -webkit-print-color-adjust:exact; print-color-adjust:exact;
}
.l1{ background:var(--zebra); font-weight:700; font-size:7.5pt; white-space:normal; overflow-wrap:break-word; word-break:keep-all; -webkit-print-color-adjust:exact; print-color-adjust:exact;
}
/* 2~3열 표만 첫 열 폭 고정 — 다열 compare에는 적용하지 않음 */
#corePrint table:not(.compare):not(.dense):not(.cheat-table) td.l1,
#corePrint table:not(.compare):not(.dense):not(.cheat-table) th.th:first-child{width:18%}
.nowrap, td.dose, .dose, td.num{ white-space:nowrap!important; overflow-wrap:normal; word-break:keep-all;
}
td.dose-long{white-space:normal; font-size:7.2pt; line-height:1.25; word-break:keep-all}
td.memo{font-size:7.2pt; line-height:1.25; word-break:keep-all}
td.num{text-align:center; font-variant-numeric:tabular-nums}
td.num.diff{color:#c2410c; font-weight:700; -webkit-print-color-adjust:exact; print-color-adjust:exact}
.muted{color:var(--muted)}
#corePrint table.dense{table-layout:fixed; font-size:7.2pt; line-height:1.22}
#corePrint table.dense td, #corePrint table.dense th{padding:0.4mm 0.55mm}
#corePrint table.dense.te-cmp col.c-el{width:8%}
#corePrint table.dense.te-cmp col.c-dose{width:15%}
#corePrint table.dense.te-cmp col.c-memo{width:47%}
#corePrint table.dense.te-ped col.c-el{width:9%}
#corePrint table.dense.te-ped col.c-dose{width:22.75%}
#corePrint table.dense.conc col.c-el{width:12%}
#corePrint table.dense.conc col.c-num{width:12.5%}
/* 제품 비교: 수치 열은 고정, 비고는 별행 */
#corePrint table.compare{table-layout:fixed; font-size:7.6pt; line-height:1.28}
#corePrint table.compare col.c-name{width:28%}
#corePrint table.compare col.c-kind{width:16%}
#corePrint table.compare col.c-num{width:11.2%}
#corePrint table.compare td.l1,
#corePrint table.compare th.l1,
#corePrint table.compare th.th:first-child{
  white-space:normal!important;
  overflow-wrap:anywhere;
  word-break:keep-all;
  overflow:hidden;
}
#corePrint table.compare td:nth-child(2){
  white-space:normal;
  overflow-wrap:break-word;
  word-break:keep-all;
}
#corePrint table.compare td.num{font-size:7.4pt}
#corePrint table.compare tr.compare-note td{
  background:#f7f9fc; font-size:6.9pt; line-height:1.3; color:var(--text);
  padding:0.45mm 0.85mm 0.7mm; border-top:0;
  white-space:normal; word-break:break-all;
}
#corePrint table.compare tr.compare-note td a{color:inherit; word-break:break-all}
tr:nth-child(even) td:not(.l1):not(.th){background:#fbfcfe}
#corePrint table.compare tr.compare-note:nth-child(even) td{background:#f7f9fc}
ul{margin:0 0 1.2mm; padding-left:3.5mm}
li{margin:0.25mm 0; line-height:1.28}
p{margin:0 0 1mm; line-height:1.28}
.x{color:var(--danger); font-weight:700}
sup.fn,.footnotes,.fnn{display:none!important}
img,svg{max-width:100%; height:auto}
/* Fluorescent marks — same colors/stops as study split-shell */
mark.hl-pink, .hl-pink{
  background:linear-gradient(transparent 8%, #f8bbd0 8%, #f8bbd0 92%, transparent 92%);
  color:inherit; padding:0 .05em;
  box-decoration-break:clone; -webkit-box-decoration-break:clone;
  -webkit-print-color-adjust:exact; print-color-adjust:exact;
}
mark.hl-yellow, .hl-yellow{
  background:linear-gradient(transparent 8%, #fff59d 8%, #fff59d 92%, transparent 92%);
  color:inherit; padding:0 .05em;
  box-decoration-break:clone; -webkit-box-decoration-break:clone;
  -webkit-print-color-adjust:exact; print-color-adjust:exact;
}
mark.hl-both, .hl-both{
  background:linear-gradient(#f8bbd0,#f8bbd0) top / 100% 46% no-repeat,
             linear-gradient(#fff59d,#fff59d) bottom / 100% 46% no-repeat;
  color:inherit; padding:0 .06em;
  box-decoration-break:clone; -webkit-box-decoration-break:clone;
  box-shadow:none; border:none; text-decoration:none;
  -webkit-print-color-adjust:exact; print-color-adjust:exact;
}
/* Keep each topic/unit on one page when it fits. Only the cheat block
   (taller than A4) may span pages — and then only between rows, never mid-cell. */
.print-sec{
  margin:0 0 0.8mm;
  break-inside:avoid; page-break-inside:avoid;
  -webkit-column-break-inside:avoid;
}
.print-sec:has(.cheat-table){
  break-inside:auto; page-break-inside:auto;
}
.print-sec > h2 + *, .print-sec > h3 + *{ break-before:avoid; page-break-before:avoid; }
tr, td, th{ break-inside:avoid; page-break-inside:avoid; }
thead{display:table-header-group}
tfoot{display:table-footer-group}
table.cheat-table{
  break-inside:auto; page-break-inside:auto;
  table-layout:fixed;
}
table.cheat-table th.l1,
table.cheat-table td.l1{width:22%}
table.cheat-table td{font-size:7.4pt; line-height:1.3}
h1,h2,h3{orphans:3; widows:3}
@page{ size:A4; margin:10mm 9mm 11mm 9mm;
  @top-left{content:none} @top-center{content:none} @top-right{content:none}
  @bottom-left{content:none} @bottom-center{content:none} @bottom-right{content:none}
  @left-top{content:none} @left-middle{content:none} @left-bottom{content:none}
  @right-top{content:none} @right-middle{content:none} @right-bottom{content:none}
}
@media print{
  .toolbar{display:none!important}
  html,body,#corePrint{overflow:visible!important; height:auto!important; max-height:none!important; max-width:100%}
  body{max-width:100%; width:auto; padding:0; margin:0; font-size:8.6pt; line-height:1.38}
  /* 표는 페이지 너비(100%)를 넘기지 않는다. nowrap·긴 토큰의 min-content가 칸을 밀지 않게 한다. */
  table{font-size:8pt; width:100%!important; max-width:100%!important}
  .print-sec{ break-inside:avoid!important; page-break-inside:avoid!important; }
  .print-sec:has(.cheat-table){ break-inside:auto!important; page-break-inside:auto!important; }
  table:not(.cheat-table){ break-inside:avoid!important; page-break-inside:avoid!important; }
  table.cheat-table{ break-inside:auto!important; page-break-inside:auto!important; }
  tr, td, th{ break-inside:avoid!important; page-break-inside:avoid!important; }
  h2, h3{ break-after:avoid!important; page-break-after:avoid!important; }
  th,td{
    padding:0.6mm 1mm;
    min-width:0;
    overflow:visible;
    word-break:keep-all;
    overflow-wrap:break-word;
    line-height:1.38;
  }
  /* 화면용 nowrap·overflow:hidden 은 인쇄에서 글자를 칸 밖에 두거나 잘라 낸다. */
  #corePrint .nowrap,
  #corePrint td.dose,
  #corePrint td.num,
  #corePrint .dose{
    white-space:normal!important;
    min-width:0;
    overflow:visible!important;
    word-break:keep-all!important;
    overflow-wrap:break-word!important;
  }
  #corePrint table.compare td,
  #corePrint table.compare th,
  #corePrint table.dense td,
  #corePrint table.dense th,
  #corePrint table.cheat-table td,
  #corePrint table.cheat-table th{
    min-width:0;
    overflow:visible;
    word-break:keep-all;
    overflow-wrap:break-word;
    line-height:1.38;
  }
  #corePrint table.compare td.l1,
  #corePrint table.compare th.l1,
  #corePrint table.compare th.th:first-child{
    overflow:visible!important;
    min-width:0;
    white-space:normal!important;
    word-break:keep-all!important;
    overflow-wrap:break-word!important;
  }
  /* 비고 행의 break-all은 줄 끝에서 20·53.6처럼 숫자를 갈라 읽기 어렵게 한다. */
  #corePrint table.compare tr.compare-note td,
  #corePrint table.compare tr.compare-note td a{
    font-size:7.2pt;
    line-height:1.35;
    word-break:keep-all!important;
    overflow-wrap:anywhere;
  }
  h2{margin:1.6mm 0 0.5mm; padding:1mm 1.6mm; font-size:9pt}
  h3{margin:1.2mm 0 0.4mm; padding:0.7mm 1.4mm; font-size:8pt}
  h1{font-size:12pt; margin:0 0 2mm}
  a{color:inherit; text-decoration:none}
  th,.th,.l1,h2,h3,
  mark.hl-pink,.hl-pink,mark.hl-yellow,.hl-yellow,mark.hl-both,.hl-both{
    -webkit-print-color-adjust:exact!important; print-color-adjust:exact!important;
  }
}
.cell{margin:0 0 1mm; line-height:1.28}
.callout{margin:0 0 1.2mm; padding:0.8mm 1.6mm; font-size:7.6pt; line-height:1.3}
.callout.gap{background:#fff8e1; border-left:2.5px solid #f0a500; color:#5a4300; -webkit-print-color-adjust:exact; print-color-adjust:exact}
.cheat-table td{font-size:7.4pt}
.ex{color:var(--muted); font-size:7.2pt}
</style>
</head>
<body>
<div class="toolbar"> <button type="button" id="btnPrint">인쇄 / PDF 저장</button> <a href="PN_study_split.html">영양불백 공부판으로</a> <span class="note">핵심본과 같은 원본(content/core.html)에서 생성</span>
</div>
<div id="corePrint" contenteditable="true" spellcheck="false">
<h1>영양불백 · PN 핵심 <span class="note">(A4 인쇄/편집)</span></h1>
<!--@@CORE@@-->
</div>
<script>
document.getElementById("btnPrint").addEventListener("click", ()=>{
  const t=document.title; document.title=" "; window.print(); document.title=t;
});
</script>
</body>
</html>
